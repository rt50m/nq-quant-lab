name: Run NQ ORB Parallel Suite 011

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nq_orb_parallel_suite_011.py'
      - 'nq_orb_research_suite_010.py'
      - '.github/workflows/run_nq_orb_parallel_suite_011.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research stack
        run: pip install pandas numpy scikit-learn tabulate joblib
      - name: Fetch NQ one-minute data mirror
        run: |
          git clone --depth 1 https://github.com/MeNameek/AnooReplay.git nq_source
          test -f nq_source/public/data/NQ/dates.json
      - name: Prepare data, gates, manifest and enhanced causality audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python nq_orb_parallel_suite_011.py \
            --mode prepare \
            --data-dir nq_source/public/data/NQ \
            --out-dir prepared_011
      - name: Publish causality audit
        if: always()
        run: |
          if [ -f prepared_011/causality_audit_011.json ]; then cat prepared_011/causality_audit_011.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload prepared research state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb011-prepared
          path: prepared_011/
          if-no-files-found: error
          retention-days: 7

  orb01:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1]
    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research stack
        run: pip install pandas numpy scikit-learn tabulate joblib
      - name: Download prepared state
        uses: actions/download-artifact@v4
        with:
          name: orb011-prepared
          path: prepared_011
      - name: Run ORB01_MODERN_5M_FORMED shard
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python nq_orb_parallel_suite_011.py \
            --mode shard \
            --prepared-path prepared_011/orb011_prepared.joblib \
            --model ORB01_MODERN_5M_FORMED \
            --shard-index ${{ matrix.shard }} \
            --shard-count 2 \
            --out-dir shard_orb01_${{ matrix.shard }}
      - name: Upload shard checkpoint/result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb011-orb01-s${{ matrix.shard }}
          path: shard_orb01_${{ matrix.shard }}/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  aggregate_orb01:
    needs: orb01
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research stack
        run: pip install pandas numpy scikit-learn tabulate joblib
      - name: Download model shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orb011-orb01-s*
          path: parts_orb01
          merge-multiple: true
      - name: Download prepared state
        uses: actions/download-artifact@v4
        with:
          name: orb011-prepared
          path: prepared_011
      - name: Aggregate ORB01_MODERN_5M_FORMED and build TradingView-style report
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python nq_orb_parallel_suite_011.py \
            --mode aggregate-model \
            --parts-dir parts_orb01 \
            --prepared-path prepared_011/orb011_prepared.joblib \
            --model ORB01_MODERN_5M_FORMED \
            --out-dir model_orb01_complete
      - name: Publish model result immediately
        if: always()
        run: |
          if [ -f model_orb01_complete/model_summary.md ]; then cat model_orb01_complete/model_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload completed model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
