name: Run NQ Alpha Factory 002

on:
  push:
    branches: [main]
    paths:
      - 'nq_alpha_factory_002.py'
      - '.github/workflows/run_nq_alpha_factory_002.yml'
  workflow_dispatch:

jobs:
  alpha-factory-002:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research stack
        run: pip install pandas numpy scikit-learn tabulate

      - name: Fetch NQ one-minute OHLCV mirror
        run: |
          git clone --depth 1 https://github.com/MeNameek/AnooReplay.git nq_source
          test -f nq_source/public/data/NQ/dates.json

      - name: Run causality-hardened Alpha Factory 002
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python nq_alpha_factory_002.py \
            --data-dir nq_source/public/data/NQ \
            --out-dir alpha_factory_002_results

      - name: Publish summary
        if: always()
        run: |
          if [ -f alpha_factory_002_results/summary.md ]; then
            cat alpha_factory_002_results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f alpha_factory_002_results/causality_audit.json ]; then
            echo '## Causality audit' >> "$GITHUB_STEP_SUMMARY"
            cat alpha_factory_002_results/causality_audit.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload factory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-alpha-factory-002-results
          path: alpha_factory_002_results/
          if-no-files-found: warn
