name: Run NQ Alpha Factory 001

on:
  push:
    branches: [main]
    paths:
      - 'nq_alpha_factory_001.py'
      - '.github/workflows/run_nq_alpha_factory_001.yml'
  workflow_dispatch:

jobs:
  alpha-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research stack
        run: pip install pandas numpy scikit-learn tabulate

      - name: Fetch NQ one-minute OHLCV mirror
        run: |
          git clone --depth 1 https://github.com/MeNameek/AnooReplay.git nq_source
          test -f nq_source/public/data/NQ/dates.json

      - name: Run full Alpha Factory
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python nq_alpha_factory_001.py \
            --data-dir nq_source/public/data/NQ \
            --out-dir alpha_factory_001_results

      - name: Publish summary
        if: always()
        run: |
          if [ -f alpha_factory_001_results/summary.md ]; then
            cat alpha_factory_001_results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload factory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-alpha-factory-001-results
          path: alpha_factory_001_results/
          if-no-files-found: warn
