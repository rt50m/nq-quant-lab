name: Run VWAP Research Sweep

on:
  push:
    branches: [main]
    paths:
      - 'vwap_research_sweep.py'
      - '.github/workflows/run_vwap_sweep.yml'
  workflow_dispatch:

jobs:
  vwap-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy numba tabulate

      - name: Fetch public NQ minute-data mirror
        run: |
          git clone --depth 1 https://github.com/MeNameek/AnooReplay.git nq_source
          test -f nq_source/public/data/NQ/dates.json

      - name: Run VWAP Research Sweep
        run: |
          python vwap_research_sweep.py \
            --data-dir nq_source/public/data/NQ \
            --out-dir vwap_sweep_results \
            --cost-points 0.50 \
            --horizon 60

      - name: Publish summary
        if: always()
        run: |
          if [ -f vwap_sweep_results/summary.md ]; then
            cat vwap_sweep_results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vwap-sweep-results
          path: vwap_sweep_results/
          if-no-files-found: warn
