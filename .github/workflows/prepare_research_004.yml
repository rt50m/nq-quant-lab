name: Research 004 - preparation audit only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research004-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research3/requirements.txt
      - run: pip install -r research3/requirements.txt
      - name: Check preparation contracts
        run: python -m unittest discover -s research4 -p 'test_*.py' -v
      - name: Download the existing frozen public data without running R3
        run: python research3/run.py download --out data_r4
      - name: Count draft menus and audit both timestamp hypotheses
        run: python research4/prepare.py --data data_r4 --out preparation_r4
      - name: Publish explicit readiness status
        if: always()
        run: |
          if [ -f preparation_r4/summary.md ]; then
            cat preparation_r4/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation failed before readiness could be assessed. No backtests were run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-preparation-only
          path: preparation_r4/
          retention-days: 90
          if-no-files-found: warn
