name: Research 007 - Portfolio Hedge Search

on:
  push:
    branches: [main]
    paths: ['research7/**', '.github/workflows/run_research_007.yml']
  workflow_dispatch:
    inputs:
      full_search:
        description: Run full 8-shard portfolio search
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: research007-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research7/requirements.txt
      - run: pip install -r research7/requirements.txt
      - name: Unit tests
        run: PYTHONPATH=research7 python -m unittest discover -s research7 -p 'test_*.py' -v
      - name: Download frozen public NQ data
        run: python research6/data.py download --out data_r7
      - name: Rebuild timestamp-audited common arrays
        run: python research4/data.py --data data_r7 --out prepared_r7
      - name: Add causal previous-close VXN metadata
        run: python research6/data.py vxn --out prepared_r7
      - name: Build exact common-engine strategy sleeves
        run: python research7/run.py build --prepared prepared_r7 --out sleeves_r7
      - name: Smoke portfolio search
        run: python research7/run.py search --sleeves sleeves_r7 --out smoke_r7 --index 0 --count 1 --samples 2000
      - name: Publish verification summary
        if: always()
        run: |
          if [ -f sleeves_r7/summary.md ]; then cat sleeves_r7/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: r7-prepared
          path: prepared_r7/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r7-sleeves
          path: sleeves_r7/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r7-verification
          path: smoke_r7/
          retention-days: 30

  search:
    needs: verify
    if: needs.verify.result == 'success' && (github.event_name == 'push' || inputs.full_search)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research7/requirements.txt
      - run: pip install -r research7/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: r7-sleeves
          path: sleeves_r7
      - name: Run portfolio search shard
        env:
          PYTHONUNBUFFERED: '1'
        run: python research7/run.py search --sleeves sleeves_r7 --out part_r7 --index ${{ matrix.shard }} --count 8 --samples 50000
      - uses: actions/upload-artifact@v4
        with:
          name: r7-shard-${{ matrix.shard }}
          path: part_r7/
          retention-days: 30

  aggregate:
    needs: [verify,search]
    if: always() && needs.verify.result == 'success' && needs.search.result == 'success' && (github.event_name == 'push' || inputs.full_search)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research7/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: r7-sleeves
          path: sleeves_r7
      - uses: actions/download-artifact@v4
        with:
          pattern: r7-shard-*
          path: parts_r7
      - name: Aggregate exact portfolio finalists
        run: python research7/run.py aggregate --sleeves sleeves_r7 --parts parts_r7 --out results_r7 --count 8
      - name: Compare with proven local benchmark
        run: |
          python research7/benchmark_compare.py \
            --report results_r7/report.json \
            --benchmark research7/local_benchmark.json \
            --out results_r7/benchmark_comparison.json
          echo "## Local-vs-GitHub benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results_r7/benchmark_comparison.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish final summary
        if: always()
        run: if [ -f results_r7/summary.md ]; then cat results_r7/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-results
          path: results_r7/
          retention-days: 90
          if-no-files-found: error
