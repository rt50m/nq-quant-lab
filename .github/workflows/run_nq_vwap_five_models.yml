name: Run NQ VWAP Five-Model Suite

on:
  push:
    branches: [main]
    paths:
      - 'nq_vwap_five_model_suite.py'
      - '.github/workflows/run_nq_vwap_five_models.yml'
  workflow_dispatch:

jobs:
  five-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout quant lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy tabulate

      - name: Fetch public NQ minute-data mirror
        run: |
          git clone --depth 1 https://github.com/MeNameek/AnooReplay.git nq_source
          test -f nq_source/public/data/NQ/dates.json

      - name: Run all five VWAP models
        run: |
          python nq_vwap_five_model_suite.py \
            --data-dir nq_source/public/data/NQ \
            --out-dir five_model_results \
            --allowed-drawdown 2500

      - name: Publish summary
        if: always()
        run: |
          if [ -f five_model_results/summary.md ]; then
            cat five_model_results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-vwap-five-model-results
          path: five_model_results/
          if-no-files-found: warn
